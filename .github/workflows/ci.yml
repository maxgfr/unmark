name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck · lint · format:check · test · build:skill · verify:skill ·
      # build · check:network. The privacy gate and the skill-bundle freshness
      # check are part of it, so neither can be skipped on the way to a merge.
      - run: pnpm verify
