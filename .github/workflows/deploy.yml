name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The inpainting model and wasm runtimes are not in git. They are pulled
      # here against pinned SHA-256 checksums so the deployed site serves them
      # from its own origin, which is what keeps connect-src 'self' honest.
      - name: Fetch pinned assets
        run: pnpm assets

      - run: pnpm build

      # A deploy must not be able to ship what CI would have rejected. Both
      # gates run: one walks the built bundle for outbound origins, the other
      # follows the import graph from the page's entry point and fails if it can
      # reach the code that calls a model.
      - name: Privacy gates
        run: pnpm check:network && pnpm check:imports

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
